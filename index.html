<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>juunne — Coming soon</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300..700;1,300..700&amp;family=Inter:wght@400;500;600&amp;display=swap"><style>body{background:#faf6ee;margin:0}
</style></head><body><main style="position: relative; width: 100%; height: 240vh; background: #faf6ee; color: #1a1712; font-family: Inter, Arial, ui-sans-serif, system-ui, sans-serif"><section aria-label="juunne — coming soon" style="position: sticky; top: 0; width: 100%; height: 100vh; overflow: hidden"><div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 58vh; overflow: hidden"><div id="halo" style="position: absolute; left: 50%; bottom: 0; width: min(960px, 130vw); height: min(960px, 130vw); border-radius: 50%; background: radial-gradient(closest-side, #ffcc3d, transparent); transform-origin: 50% 50%; will-change: transform; transform: translate(-50%, 50%); opacity: 0.85"></div></div><div aria-hidden="true" style="position: absolute; left: clamp(24px, 6.5vw, 96px); right: clamp(24px, 6.5vw, 96px); top: 58vh; height: 1px; background: #d9d0c1"></div><h1 style="position: absolute; left: 50%; top: calc(58vh - 0.2665 * clamp(300px, 52vw, 760px)); width: clamp(300px, 52vw, 760px); margin: 0; transform: translateX(-50%); line-height: 0"><img src="/juunne.png" alt="juunne" style="display: block; width: 100%; height: auto"></h1><p style="position: absolute; left: 0; right: 0; top: calc(58vh + clamp(72px, 9vw, 130px)); margin: 0; text-align: center; font-family: Inter, Arial, ui-sans-serif, system-ui, sans-serif; font-weight: 600; font-size: clamp(12px, 1.05vw, 15px); letter-spacing: 0.34em; text-transform: uppercase; color: #6e4fd0">Coming soon</p></section></main><script>
  const halo = document.getElementById('halo');
  function updateHalo() {
    const range = document.documentElement.scrollHeight - window.innerHeight;
    const p = range > 0 ? Math.min(1, Math.max(0, window.scrollY / range)) : 0;
    const eased = 1 - Math.pow(1 - p, 2);
    const v = Math.min(1, Math.max(0, (p - 0.05) / 0.6));
    const k = v * v * (3 - 2 * v);
    const peach = (0.5 - 0.15 * (1 - k)).toFixed(3);
    halo.style.transform = 'translate(-50%, 50%) scale(' + (1 + 3 * eased) + ')';
    halo.style.opacity = 0.85 + 0.15 * eased;
    halo.style.background = 'radial-gradient(closest-side, #ffcc3d 0%, rgba(255, 208, 20, 0.78) 22%, rgba(250, 160, 110, ' + peach + ') 40%, '
          + 'rgba(' + Math.round(250 - 67 * k) + ', ' + Math.round(160 - 10 * k) + ', ' + Math.round(110 + 145 * k) + ', ' + (0.08 * (1 - k) + 0.55 * k).toFixed(3) + ') 60%, '
          + 'rgba(110, 79, 208, ' + (0.32 * k).toFixed(3) + ') 78%, '
          + 'rgba(110, 79, 208, ' + (0.08 * k).toFixed(3) + ') 92%, rgba(250, 246, 238, 0) 100%)';
  }
  window.addEventListener('scroll', updateHalo, { passive: true });
  window.addEventListener('resize', updateHalo);
  updateHalo();
</script></body></html>
